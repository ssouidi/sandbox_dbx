  - "bash"
  - "-c"
  - |
    # 1️⃣ Copy the wheels from DBFS to a local folder
    mkdir -p /tmp/wheels
    cp -r /dbfs/FileStore/wheels/* /tmp/wheels/

    # 2️⃣ Install all wheels from the local folder
    pip install /tmp/wheels/*.whl

    # 3️⃣ Start the app
    gunicorn main:app -w 2 --worker-class uvicorn.workers.UvicornWorker

env:
  - name: "SERVING_ENDPOINT_NAME"
    value: "databricks-meta-llama-3-3-70b-instruct"